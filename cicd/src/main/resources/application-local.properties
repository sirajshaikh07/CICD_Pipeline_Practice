# ============================================================================
# application-local.properties — LOCAL Development Configuration
# ============================================================================
# Activated via: SPRING_PROFILES_ACTIVE=local
# Use this for local development with pgAdmin / local PostgreSQL
# DO NOT commit passwords to Git — add to .gitignore if needed
# ============================================================================

spring.application.name=cicd

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── PostgreSQL DataSource (Local pgAdmin) ───────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/cicd_test_db
spring.datasource.username=postgres
spring.datasource.password=siraj
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.example=DEBUG
