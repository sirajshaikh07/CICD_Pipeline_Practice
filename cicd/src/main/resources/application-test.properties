# ============================================================================
# application-test.properties — TEST environment configuration
# ============================================================================
# Activated via: SPRING_PROFILES_ACTIVE=test
# All sensitive values are injected via environment variables in CI/CD
# ============================================================================

spring.application.name=cicd

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── PostgreSQL DataSource (injected from GitHub Secrets / env vars) ─────────
# These are overridden by environment variables in CI/CD:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cicd_test_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:test_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
