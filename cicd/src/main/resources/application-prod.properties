# ============================================================================
# application-prod.properties — PRODUCTION environment configuration
# ============================================================================
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST be injected via environment variables
# NEVER hardcode production credentials!
# ============================================================================

spring.application.name=cicd

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── PostgreSQL DataSource (injected from environment) ───────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Connection Pool (HikariCP) ─────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# VALIDATE only in prod — never auto-modify production schema!
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Actuator (restricted in production) ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
