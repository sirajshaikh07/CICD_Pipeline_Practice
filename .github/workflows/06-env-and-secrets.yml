# ============================================================
# LAB 06 — ENVIRONMENT VARIABLES & SECRETS
# ============================================================
# 🎯 Goal: Manage config and sensitive data at different scopes
#
# Concepts Covered:
#   - Workflow-level env vars
#   - Job-level env vars
#   - Step-level env vars
#   - GitHub Secrets (${{ secrets.NAME }})
#   - GitHub Contexts (${{ github.* }})
#   - Passing data between steps with GITHUB_OUTPUT
#
# 📖 Docs: https://docs.github.com/en/actions/learn-github-actions/variables
# ============================================================

name: "Lab 06 — Env Vars & Secrets"

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

# WORKFLOW-LEVEL: Available to ALL jobs and steps
env:
  APP_NAME: "CICD Todo App"
  APP_VERSION: "0.0.1-SNAPSHOT"
  JAVA_VERSION: "21"

jobs:
  # -----------------------------------------------------------
  # JOB 1: Demonstrate variable scopes
  # -----------------------------------------------------------
  show-variables:
    name: "📋 Show Variables"
    runs-on: ubuntu-latest

    # JOB-LEVEL: Available to all steps in THIS job only
    env:
      JOB_SCOPE: "I'm only visible in this job"
      DB_HOST: "localhost"
      DB_PORT: "5432"

    steps:
      - name: "🌍 Workflow-Level Vars"
        run: |
          echo "App Name:    $APP_NAME"
          echo "App Version: $APP_VERSION"
          echo "Java:        $JAVA_VERSION"

      - name: "📦 Job-Level Vars"
        run: |
          echo "Job Scope: $JOB_SCOPE"
          echo "DB Host:   $DB_HOST"
          echo "DB Port:   $DB_PORT"

      - name: "🔹 Step-Level Vars"
        # STEP-LEVEL: Only visible in THIS step
        env:
          STEP_SCOPE: "I'm only visible in this step"
          GREETING: "Hello from step!"
        run: |
          echo "Step Scope: $STEP_SCOPE"
          echo "Greeting:   $GREETING"

      - name: "🔒 Secrets (will be masked as ***)"
        run: |
          echo "DB Password: ${{ secrets.DB_PASSWORD }}"
          echo "💡 If you see ***, that means the secret is working!"
          echo "💡 If empty, you need to add DB_PASSWORD in repo settings"

      - name: "🔍 GitHub Contexts"
        run: |
          echo "Repository:    ${{ github.repository }}"
          echo "Repo Owner:    ${{ github.repository_owner }}"
          echo "Branch:        ${{ github.ref_name }}"
          echo "SHA (short):   ${GITHUB_SHA::7}"
          echo "Event:         ${{ github.event_name }}"
          echo "Actor:         ${{ github.actor }}"
          echo "Run ID:        ${{ github.run_id }}"
          echo "Run Number:    ${{ github.run_number }}"
          echo "Workflow:      ${{ github.workflow }}"
          echo "Deploy Env:    ${{ inputs.deploy_env }}"

  # -----------------------------------------------------------
  # JOB 2: Pass data between steps and jobs
  # -----------------------------------------------------------
  pass-data:
    name: "🔗 Pass Data Between Steps"
    runs-on: ubuntu-latest
    # Expose outputs for other jobs to consume
    outputs:
      build-version: ${{ steps.set-version.outputs.version }}
      build-date: ${{ steps.set-date.outputs.date }}

    steps:
      # Set output using GITHUB_OUTPUT
      - name: "📤 Set Version Output"
        id: set-version
        run: echo "version=${{ env.APP_VERSION }}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: "📤 Set Date Output"
        id: set-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Read outputs from previous steps
      - name: "📥 Read Step Outputs"
        run: |
          echo "Version: ${{ steps.set-version.outputs.version }}"
          echo "Date:    ${{ steps.set-date.outputs.date }}"

  # -----------------------------------------------------------
  # JOB 3: Consume outputs from another job
  # -----------------------------------------------------------
  use-data:
    name: "📥 Use Data From Previous Job"
    runs-on: ubuntu-latest
    needs: pass-data    # Wait for pass-data job to complete

    steps:
      - name: "📥 Read Job Outputs"
        run: |
          echo "Build Version: ${{ needs.pass-data.outputs.build-version }}"
          echo "Build Date:    ${{ needs.pass-data.outputs.build-date }}"

# ============================================================
# ✅ PRACTICE TASKS:
#   1. Add secret DB_PASSWORD in repo Settings → Secrets
#   2. Trigger manually → verify variables are printed
#   3. CHALLENGE: Add API_KEY secret and use it in a step
#   4. CHALLENGE: Use ${{ github.event_name }} in a conditional
#   5. CHALLENGE: Pass the JAR filename between steps
# ============================================================
