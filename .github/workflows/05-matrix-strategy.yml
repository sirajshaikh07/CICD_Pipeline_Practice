# ============================================================
# LAB 05 — MATRIX STRATEGY
# ============================================================
# 🎯 Goal: Run builds across multiple Java & Node versions in parallel
#
# Concepts Covered:
#   - strategy.matrix — Define variable combinations
#   - Parallel job execution
#   - fail-fast — Control failure behavior
#   - exclude / include — Fine-tune combinations
#
# 📖 Docs: https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
# ============================================================

name: "Lab 05 — Matrix Strategy"

on:
  workflow_dispatch:   # Manual trigger for practice

jobs:
  # -----------------------------------------------------------
  # JOB: Build backend across multiple Java versions
  # -----------------------------------------------------------
  backend-matrix:
    name: "☕ Java ${{ matrix.java-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true    # Set to false to let all versions complete
      matrix:
        java-version: [17, 21, 23]   # Test across 3 LTS/latest versions

    defaults:
      run:
        working-directory: ./cicd

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☕ Set up JDK ${{ matrix.java-version }}"
        uses: actions/setup-java@v4
        with:
          java-version: "${{ matrix.java-version }}"
          distribution: "temurin"

      - name: "🔧 Make mvnw executable"
        run: chmod +x mvnw

      - name: "🔨 Compile & Test"
        run: ./mvnw verify -B -q

      - name: "✅ Result"
        run: echo "✅ Java ${{ matrix.java-version }} build passed!"

  # -----------------------------------------------------------
  # JOB: Build frontend across multiple Node versions
  # -----------------------------------------------------------
  frontend-matrix:
    name: "📦 Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [18, 20, 22]

    defaults:
      run:
        working-directory: ./todo-frontend

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Set up Node ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node-version }}"

      - name: "📦 Install & Build"
        run: |
          npm ci
          npm run build

      - name: "✅ Result"
        run: echo "✅ Node ${{ matrix.node-version }} build passed!"

# ============================================================
# ✅ PRACTICE TASKS:
#   1. Trigger manually → observe 6 parallel jobs
#   2. Set fail-fast: false → break one version → others continue
#   3. CHALLENGE: Add exclude to skip Java 17 + specific combos
#   4. CHALLENGE: Add include for an extra combination
# ============================================================
