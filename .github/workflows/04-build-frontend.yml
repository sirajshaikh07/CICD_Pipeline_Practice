# ============================================================
# LAB 04 — BUILD FRONTEND (React + Vite)
# ============================================================
# 🎯 Goal: Set up Node.js, install deps, lint, and build frontend
#
# Concepts Covered:
#   - actions/setup-node — Install Node.js
#   - npm ci — Clean, deterministic install
#   - npm run lint — Code quality checks
#   - npm run build — Production build
#   - continue-on-error — Non-blocking steps
#
# 📖 Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
# ============================================================

name: "Lab 04 — Build Frontend"

on:
  push:
    branches: [main]
    paths:
      - "todo-frontend/**"   # Only trigger when frontend files change
  pull_request:
    branches: [main]
    paths:
      - "todo-frontend/**"
  workflow_dispatch:

jobs:
  build-frontend:
    name: "⚛️ Build React Frontend"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./todo-frontend

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      # Set up Node.js (matching your project needs)
      - name: "📦 Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Clean install — uses package-lock.json for deterministic builds
      - name: "📦 Install Dependencies"
        run: npm ci

      # Lint — check code quality with ESLint
      - name: "🔍 Lint Code"
        run: npm run lint
        continue-on-error: false  # Set to true to make lint non-blocking

      # Build — create production-optimized bundle
      - name: "🔨 Build Production Bundle"
        run: npm run build

      # Verify build output
      - name: "✅ Verify Build Output"
        run: |
          echo "=== Build Output ==="
          ls -lh dist/
          echo ""
          echo "=== Bundle Size ==="
          du -sh dist/
          echo ""
          echo "✅ Frontend build successful!"

# ============================================================
# ✅ PRACTICE TASKS:
#   1. Push this file → verify frontend builds
#   2. Introduce a lint error → watch it fail → fix it
#   3. CHALLENGE: Print build output size with du -sh dist/
#   4. CHALLENGE: Set continue-on-error: true on lint step
# ============================================================
