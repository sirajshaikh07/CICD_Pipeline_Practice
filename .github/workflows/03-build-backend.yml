# ============================================================
# LAB 03 — BUILD BACKEND (Spring Boot + Maven)
# ============================================================
# 🎯 Goal: Set up Java, compile, test, and package your backend
#
# Concepts Covered:
#   - actions/setup-java — Install JDK
#   - working-directory — Run commands in a subdirectory
#   - Maven lifecycle (compile → test → package)
#   - Test result reporting
#
# 📖 Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven
# ============================================================

name: "Lab 03 — Build Backend"

on:
  push:
    branches: [main]
    paths:
      - "cicd/**"      # Only trigger when backend files change
  pull_request:
    branches: [main]
    paths:
      - "cicd/**"
  workflow_dispatch:     # Allow manual trigger for practice

jobs:
  build-backend:
    name: "☕ Build Spring Boot Backend"
    runs-on: ubuntu-latest

    # Default working directory for all 'run' steps in this job
    defaults:
      run:
        working-directory: ./cicd

    steps:
      # Step 1: Checkout the repository
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 (matching your pom.xml)
      - name: "☕ Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"    # Eclipse Temurin (AdoptOpenJDK)

      # Step 3: Make Maven wrapper executable
      - name: "🔧 Make mvnw executable"
        run: chmod +x mvnw

      # Step 4: Compile the project
      - name: "🔨 Compile"
        run: ./mvnw compile -B -q
        # -B = batch mode (non-interactive)
        # -q = quiet (less output)

      # Step 5: Run tests
      - name: "🧪 Run Tests"
        run: ./mvnw test -B

      # Step 6: Package as JAR (skip tests since we already ran them)
      - name: "📦 Package JAR"
        run: ./mvnw package -B -DskipTests

      # Step 7: Verify the JAR was created
      - name: "✅ Verify Build Output"
        run: |
          echo "=== Build Artifacts ==="
          ls -lh target/*.jar
          echo ""
          echo "✅ Backend build successful!"

# ============================================================
# ✅ PRACTICE TASKS:
#   1. Push this file → verify the backend compiles
#   2. Add a failing test → observe failure in Actions
#   3. Fix the test → push → confirm green ✅
#   4. CHALLENGE: Add 'mvn verify' for integration tests
#   5. CHALLENGE: Display the JAR filename with ls target/*.jar
# ============================================================
