# ============================================================
# LAB 08 — CACHING & ARTIFACTS
# ============================================================
# 🎯 Goal: Speed up builds with caching and share files between jobs
#
# Concepts Covered:
#   - actions/cache — Cache dependencies between workflow runs
#   - actions/upload-artifact — Save build outputs
#   - actions/download-artifact — Retrieve artifacts in other jobs
#   - Cache keys — Based on lock file hashes
#
# 📖 Docs: https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
# ============================================================

name: "Lab 08 — Caching & Artifacts"

on:
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # JOB 1: Build backend with Maven caching
  # -----------------------------------------------------------
  build-backend:
    name: "☕ Build Backend (with cache)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./cicd

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☕ Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # CACHE: Store Maven dependencies between runs
      - name: "💾 Cache Maven Dependencies"
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository       # Maven local repo location
          key: maven-${{ runner.os }}-${{ hashFiles('cicd/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: "🔧 Make mvnw executable"
        run: chmod +x mvnw

      - name: "📦 Build JAR"
        run: ./mvnw package -B -DskipTests

      # ARTIFACT: Upload the JAR for other jobs to use
      - name: "📤 Upload JAR Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: cicd/target/*.jar
          retention-days: 7        # Auto-delete after 7 days

  # -----------------------------------------------------------
  # JOB 2: Build frontend with npm caching
  # -----------------------------------------------------------
  build-frontend:
    name: "⚛️ Build Frontend (with cache)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./todo-frontend

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Set up Node 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # CACHE: Store node_modules between runs
      - name: "💾 Cache Node Modules"
        uses: actions/cache@v4
        with:
          path: todo-frontend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('todo-frontend/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: "📦 Install Dependencies"
        run: npm ci

      - name: "🔨 Build"
        run: npm run build

      # ARTIFACT: Upload the dist folder
      - name: "📤 Upload Frontend Build"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: todo-frontend/dist/
          retention-days: 7

  # -----------------------------------------------------------
  # JOB 3: Download and verify artifacts from both builds
  # -----------------------------------------------------------
  verify-artifacts:
    name: "✅ Verify Artifacts"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # Wait for both builds

    steps:
      # Download backend artifact
      - name: "📥 Download Backend JAR"
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend-build

      # Download frontend artifact
      - name: "📥 Download Frontend Dist"
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-build

      # List all downloaded artifacts
      - name: "📋 List All Artifacts"
        run: |
          echo "=== Backend JAR ==="
          ls -lh ./backend-build/
          echo ""
          echo "=== Frontend Dist ==="
          ls -lh ./frontend-build/
          echo ""
          echo "✅ All artifacts downloaded successfully!"

# ============================================================
# ✅ PRACTICE TASKS:
#   1. Run twice → 2nd run should show "Cache restored"
#   2. Verify the verify-artifacts job downloads both builds
#   3. CHALLENGE: Add retention-days: 5 to limit storage
#   4. CHALLENGE: Add a cache for Gradle if you ever switch
#   5. CHALLENGE: Upload test reports as artifacts
# ============================================================
