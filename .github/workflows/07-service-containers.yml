# ============================================================
# LAB 07 — SERVICE CONTAINERS (PostgreSQL)
# ============================================================
# 🎯 Goal: Spin up PostgreSQL for integration testing
#
# Concepts Covered:
#   - services — Run Docker containers alongside your job
#   - Health checks — Wait for service readiness
#   - Port mapping — Connect to service containers
#   - Environment configuration for DB connection
#
# 📖 Docs: https://docs.github.com/en/actions/using-containerized-services
# ============================================================

name: "Lab 07 — Service Containers"

on:
  workflow_dispatch:

jobs:
  integration-test:
    name: "🐘 Integration Tests with PostgreSQL"
    runs-on: ubuntu-latest

    # -----------------------------------------------------------
    # SERVICE CONTAINERS: Run alongside the job
    # -----------------------------------------------------------
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432        # Map container port to host
        # Health check: Retry until PostgreSQL is ready
        options: >-
          --health-cmd="pg_isready -U myuser -d mydatabase"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Environment variables for the application
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    defaults:
      run:
        working-directory: ./cicd

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "☕ Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # Verify PostgreSQL is running and accessible
      - name: "🐘 Test DB Connection"
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=secret psql -h localhost -U myuser -d mydatabase -c "SELECT version();"
          echo "✅ PostgreSQL is running and accessible!"

      # Create a test table to verify DB operations
      - name: "📋 Create Test Table"
        run: |
          PGPASSWORD=secret psql -h localhost -U myuser -d mydatabase << 'EOF'
          CREATE TABLE IF NOT EXISTS health_check (
            id SERIAL PRIMARY KEY,
            status VARCHAR(50),
            checked_at TIMESTAMP DEFAULT NOW()
          );
          INSERT INTO health_check (status) VALUES ('healthy');
          SELECT * FROM health_check;
          EOF
          echo "✅ Test table created and data inserted!"

      - name: "🔧 Make mvnw executable"
        run: chmod +x mvnw

      # Run the actual Spring Boot tests against PostgreSQL
      - name: "🧪 Run Integration Tests"
        run: ./mvnw test -B
        continue-on-error: true   # Don't fail if tests aren't configured yet

      - name: "✅ Summary"
        run: |
          echo "============================================"
          echo "  ✅ Integration test environment verified!"
          echo "  🐘 PostgreSQL: localhost:5432/mydatabase"
          echo "  👤 User: myuser"
          echo "============================================"

# ============================================================
# ✅ PRACTICE TASKS:
#   1. Push → verify PostgreSQL starts & health check passes
#   2. Observe the "Test DB Connection" step
#   3. CHALLENGE: Add a Redis service container alongside Postgres
#   4. CHALLENGE: Run your actual Spring Boot tests against this DB
#   5. CHALLENGE: Add a step that creates your app's schema
# ============================================================
