# ============================================================================
# 03-DEPLOY-TEST.YML — Deploy to TEST Environment
# ============================================================================
# SECRETS NEEDED:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DOCKERHUB_REPO
#   TEST_DB_HOST, TEST_DB_PORT, TEST_DB_NAME, TEST_DB_USER, TEST_DB_PASSWORD
#   TEST_SERVER_HOST, TEST_SERVER_USER, TEST_SERVER_SSH_KEY
# FUTURE: Kubernetes, Terraform, Ansible, OCI
# ============================================================================

name: "Deploy → TEST Environment"

on:
  workflow_run:
    workflows: ["Build & Push Docker Image"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: "develop"

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  DEPLOY_ENV: test
  APP_PORT: 8080

jobs:
  deploy-test:
    name: "🚀 Deploy to TEST"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: test
      url: "http://${{ secrets.TEST_SERVER_HOST }}:8080"

    steps:
      - name: "⬇️ Checkout code"
        uses: actions/checkout@v4

      - name: "🏷️ Determine image tag"
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=develop" >> $GITHUB_OUTPUT
          fi

      - name: "🔑 Deploy to test server via SSH"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_REPO }}:${{ steps.tag.outputs.IMAGE_TAG }}
            docker stop cicd-backend-test || true
            docker rm cicd-backend-test || true
            docker run -d \
              --name cicd-backend-test \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:8080 \
              -e SPRING_PROFILES_ACTIVE=test \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.TEST_DB_HOST }}:${{ secrets.TEST_DB_PORT }}/${{ secrets.TEST_DB_NAME }} \
              -e SPRING_DATASOURCE_USERNAME=${{ secrets.TEST_DB_USER }} \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.TEST_DB_PASSWORD }} \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
              ${{ secrets.DOCKERHUB_REPO }}:${{ steps.tag.outputs.IMAGE_TAG }}
            docker image prune -f

      # FUTURE: Kubernetes deployment (uncomment when ready)
      # - name: "☸️ Set up kubectl"
      #   uses: azure/setup-kubectl@v3
      # - name: "☸️ Deploy to K8s test namespace"
      #   run: |
      #     kubectl set image deployment/cicd-backend \
      #       cicd-backend=${{ secrets.DOCKERHUB_REPO }}:${{ steps.tag.outputs.IMAGE_TAG }} -n test

  smoke-test:
    name: "🔥 Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - name: "⏳ Wait for app startup"
        run: sleep 30

      - name: "🏥 Health check"
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://${{ secrets.TEST_SERVER_HOST }}:8080/actuator/health || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "⏳ Attempt $i/10 — Retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check FAILED"
          exit 1
